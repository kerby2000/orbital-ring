[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "orbital-ring"
version = "0.4.0"
description = "Traceable orbital and M0/M1 magnetic feasibility kernel for orbital-ring studies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OR-0 / OR-1 project" }]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pint>=0.23",
  "pyarrow>=15",
  "PyYAML>=6.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
orbital-ring = "orbital_ring.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbital_ring"]
force-include = { "data/materials/registry.json" = "orbital_ring/data/materials/registry.json" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
